services:
  yoga-client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_LIVEKIT_URL: ${VITE_LIVEKIT_URL}
        VITE_LIVEKIT_TOKEN_ENDPOINT: ${VITE_LIVEKIT_TOKEN_ENDPOINT}
        VITE_LIVEKIT_ROOM_NAME: ${VITE_LIVEKIT_ROOM_NAME}
        VITE_LIVEKIT_AGENT_NAME: ${VITE_LIVEKIT_AGENT_NAME}
    restart: unless-stopped
    networks:
      - divescale-net

  yoga-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - divescale-net

networks:
  divescale-net:
    external: true
