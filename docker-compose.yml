services:
  nginx:
    image: nginx:alpine
    container_name: yoga-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - client
      - server
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_LIVEKIT_URL: ${VITE_LIVEKIT_URL}
        VITE_LIVEKIT_TOKEN_ENDPOINT: ${VITE_LIVEKIT_TOKEN_ENDPOINT}
        VITE_LIVEKIT_ROOM_NAME: ${VITE_LIVEKIT_ROOM_NAME}
        VITE_LIVEKIT_AGENT_NAME: ${VITE_LIVEKIT_AGENT_NAME}
    restart: unless-stopped

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    env_file:
      - .env
    restart: unless-stopped
