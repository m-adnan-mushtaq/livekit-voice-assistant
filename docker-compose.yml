services:
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_LIVEKIT_URL: ${VITE_LIVEKIT_URL}
        VITE_LIVEKIT_TOKEN_ENDPOINT: ${VITE_LIVEKIT_TOKEN_ENDPOINT}
        VITE_LIVEKIT_ROOM_NAME: ${VITE_LIVEKIT_ROOM_NAME}
        VITE_LIVEKIT_AGENT_NAME: ${VITE_LIVEKIT_AGENT_NAME}
    ports:
      - "8003:80"
    restart: unless-stopped

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8004:8000"
    restart: unless-stopped
